# ─────────────────────────────────────────────────────────────────────────────
# brand_map.yaml — GSM Outdoors brand configuration
# ─────────────────────────────────────────────────────────────────────────────
# This file is the SINGLE SOURCE OF TRUTH for:
#   - Brand names and all their aliases / model names
#   - Category keywords (words that identify a category without naming a brand)
#   - Product types within each category
#   - Ops keywords (bypass brand gate entirely)
#   - Catalogue keywords (general questions, no brand needed)
#
# HOW TO ADD A NEW BRAND:
#   1. Find the right category (fishing / hunting / wireless) or add a new one
#   2. Add the brand name to the brands list
#   3. Add all model names and common misspellings to brand_aliases
#   4. No code changes needed — brand_gate.py reloads this file automatically
#
# HOW TO ADD A NEW CATEGORY:
#   1. Add a new top-level key under categories:
#   2. Fill in brands, keywords, products, brand_aliases
#   3. Create the corresponding wiki subfolder
# ─────────────────────────────────────────────────────────────────────────────

# ── Ops keywords — bypass brand gate entirely ─────────────────────────────────
# Questions matching any of these go straight to agent-operations.md (2026-05-21: page not yet created — ops bypass currently routes to general wiki retrieval)
ops_keywords:
  # Support hours / contact
  - hours
  - holiday
  - schedule
  - when are you open
  - are you open
  - contact
  - phone number
  - email address
  - support hours
  - closed
  - open today
  - 8 am
  - cst
  # Dealer / wholesale
  # - dealer   # commented out: too broad — "warranty through a dealer" was bypassing brand gate
  - wholesale
  - distributor
  - become a dealer
  - bass pro
  - cabela
  - bc order
  - unit of measure
  # Catalogue / overview — no brand needed to answer
  - how many brands
  - what brands
  - which brands
  - brands do you carry
  - brands you carry
  - brands you sell
  - brands you offer
  - what products
  - which products
  - products do you carry
  - products you carry
  - products you sell
  - products you offer
  - what do you sell
  - what do you carry
  - what do you offer
  - tell me about gsm
  - about gsm
  - what is gsm
  - overview
  - catalogue
  - catalog
  - full list

# ── Catalogue keywords — suppress brand context even if brand is in session ───
# These questions need a general answer regardless of confirmed brand
catalogue_keywords:
  - how many brands
  - what brands
  - which brands
  - brands do you carry
  - brands you carry
  - brands you sell
  - what products
  - which products
  - products do you carry
  - what do you sell
  - what do you carry
  - tell me about gsm
  - overview
  - catalogue
  - catalog
  - full list
  - how many
  - list all
  - what all

